<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiFriend - AI智能助手</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 顶部导航 -->
    <header id="header">
      <div class="header-left">
        <button id="roleBtn" class="icon-btn">
          <span id="currentRoleEmoji">👩‍💼</span>
        </button>
        <div class="header-info">
          <h1 id="appTitle">AiFriend</h1>
          <p id="roleStatus" class="role-status"></p>
        </div>
      </div>
      <div class="header-right">
        <button id="quotaBtn" class="quota-btn">
          <span id="quotaText">50</span>
        </button>
        <button id="settingsBtn" class="icon-btn">⚙️</button>
      </div>
    </header>

    <!-- 主聊天区域 -->
    <main id="mainView">
      <div class="chat-container">
        <div id="chatMessages" class="chat-messages">
          <!-- 消息将动态插入这里 -->
        </div>

        <div class="chat-input-container">
          <input 
            type="text" 
            id="messageInput" 
            class="chat-input" 
            placeholder="输入消息..."
            autocomplete="off"
          >
          <button id="sendButton" class="send-button">
            <span>📤</span>
          </button>
        </div>
      </div>
    </main>

    <!-- 角色广场视图 -->
    <div id="roleSquareView" class="view hidden">
      <div class="view-header">
        <button id="backFromRoles" class="back-btn">← 返回</button>
        <h2 id="roleSquareTitle">角色广场</h2>
      </div>
      <div class="role-square-content">
        <div id="roleCategories"></div>
      </div>
    </div>

    <!-- 会员视图 -->
    <div id="membershipView" class="view hidden">
      <div class="view-header">
        <button id="backFromMembership" class="back-btn">← 返回</button>
        <h2 id="membershipTitle">会员中心</h2>
      </div>
      <div class="membership-content">
        <div class="membership-status">
          <h3 id="membershipStatusTitle">当前状态</h3>
          <div id="membershipStatusContent"></div>
        </div>
        <div class="membership-plans" id="membershipPlans"></div>
      </div>
    </div>

    <!-- 设置视图 -->
    <div id="settingsView" class="view hidden">
      <div class="view-header">
        <button id="backFromSettings" class="back-btn">← 返回</button>
        <h2 id="settingsTitle">设置</h2>
      </div>
      <div class="settings-content">
        <div class="setting-group">
          <h3 id="languageTitle">语言</h3>
          <select id="languageSelect" class="setting-select">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </div>
        
        <div class="setting-group">
          <h3>API Key</h3>
          <input 
            type="password" 
            id="apiKeyInput" 
            class="setting-input" 
            placeholder="输入你的 AI API Key（可选）"
          >
          <p class="setting-hint">填入你自己的 API Key 可以获得更好的体验</p>
        </div>
        
        <div class="setting-group">
          <button id="clearHistoryBtn" class="danger-btn">清空对话历史</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 脚本 -->
  <script type="module" src="app.js?v=2.0"></script>
  <script>
    // 版本检查和缓存清除提示
    console.log('🚀 AiFriend v2.0 - Wallet Integration');
    console.log('📅 Build Date:', new Date().toISOString());
    
    // 检查是否需要强制刷新
    const APP_VERSION = '2.0';
    const savedVersion = localStorage.getItem('app_version');
    
    if (savedVersion && savedVersion !== APP_VERSION) {
      console.warn('⚠️ 检测到版本更新，正在清除缓存...');
      
      // 清除 Service Worker 缓存
      if ('caches' in window) {
        caches.keys().then(names => {
          names.forEach(name => caches.delete(name));
        });
      }
      
      // 保存新版本号
      localStorage.setItem('app_version', APP_VERSION);
      
      // 提示用户刷新
      if (confirm('🎉 检测到新版本！\n\n新增功能：\n✅ 一键钱包支付\n✅ 支持 TronLink 和 imToken\n\n点击确定刷新页面')) {
        window.location.reload(true);
      }
    } else if (!savedVersion) {
      localStorage.setItem('app_version', APP_VERSION);
    }
  </script>
</body>
</html>
