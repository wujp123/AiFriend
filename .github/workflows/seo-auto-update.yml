name: SEO Auto Update

on:
  # 每天运行一次 (UTC 时间 00:00)
  schedule:
    - cron: '0 0 * * *'
  
  # 手动触发
  workflow_dispatch:
  
  # 当有新的 HTML 文件被推送时
  push:
    paths:
      - '**.html'
    branches:
      - main

jobs:
  update-seo:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🟢 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 🔧 运行 SEO 更新
        run: |
          node seo-auto-update.js
      
      - name: 📊 检查更改
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 💾 提交更改
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sitemap.xml robots.txt public/sitemap.xml public/robots.txt
          git commit -m "chore: Auto update SEO files [skip ci]" || exit 0
          git push
      
      - name: ✅ 完成
        run: |
          echo "SEO 文件已自动更新！"
          echo "更新时间: $(date)"
